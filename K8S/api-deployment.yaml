apiVersion: apps/v1
kind: Deployment

metadata:
  name: ai-knowledge-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: ai-knowledge-api

  template:
    metadata:
      labels:
        app: ai-knowledge-api

    spec:
      containers:
        - name: api
          image: ai-knowledge-assistant:latest

          imagePullPolicy: Never

          ports:
            - containerPort: 8000

          env:
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: groq-secret
                  key: GROQ_API_KEY

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20