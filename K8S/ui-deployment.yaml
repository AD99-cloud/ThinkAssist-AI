apiVersion: apps/v1
kind: Deployment

metadata:
  name: ai-knowledge-ui

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ai-knowledge-ui

  template:
    metadata:
      labels:
        app: ai-knowledge-ui

    spec:
      containers:
        - name: ui
          image: ai-knowledge-assistant:latest

          imagePullPolicy: Never

          command:
            - streamlit
            - run
            - UI/streamlit_app.py
            - --server.address=0.0.0.0
            - --server.port=8501

          ports:
            - containerPort: 8501