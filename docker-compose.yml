services:

  api:
    build: .
    container_name: ai-knowledge-assistant-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    restart: unless-stopped


  ui:
    build: .

    container_name: ai-knowledge-assistant-ui

    command:
      [
        "streamlit",
        "run",
        "UI/streamlit_app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501"
      ]

    ports:
      - "8501:8501"

    depends_on:
      - api

    restart: unless-stopped